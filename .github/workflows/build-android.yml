name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 规范依赖修改：解绑 intl 并在正确的节点插入 auto_orientation 与 overrides
      - name: Patch Dependencies
        run: |
          cd simple_live_app
          # 解除 intl 版本限制
          sed -i 's/intl: \^0.20.2/intl: any/g' pubspec.yaml

          # 使用安全的命令追加 auto_orientation 和 dynamic_color 重写规则
          flutter pub add auto_orientation:^2.2.1
          
          # 写入 dependency_overrides 解决 dynamic_color 语法问题
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  dynamic_color: 1.7.0" >> pubspec.yaml

      # 2. 清理旧缓存并获取依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter clean
          flutter pub get

      # 3. 编译 Release APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # 4. 上传产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
