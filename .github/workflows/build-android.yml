name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 使用 Python 安全修补 pubspec.yaml，避免 YAML 语法缩进错位
      - name: Safely Patch pubspec.yaml
        run: |
          cd simple_live_app
          python3 -c "
          path = 'pubspec.yaml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # 替换 intl 约束
          content = content.replace('intl: ^0.20.2', 'intl: any')

          # 在 dependencies: 节点下插入 auto_orientation
          if 'auto_orientation:' not in content:
              content = content.replace('dependencies:\n', 'dependencies:\n  auto_orientation: ^2.2.1\n')

          # 在文件末尾追加顶级 dependency_overrides
          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  dynamic_color: 1.7.0\n'

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # 2. 清理陈旧写死的 Plugin Registrant
      - name: Clean Outdated Plugin Registrant
        run: |
          cd simple_live_app
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter clean

      # 3. 拉取依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 4. 关键：修复 auto_orientation 插件缺失 namespace 的问题 (兼容 AGP 8.0+)
      - name: Patch auto_orientation Namespace for AGP
        run: |
          PYTHON_SCRIPT=$(cat << 'EOF'
          import glob, os

          pattern = os.path.expanduser('~/.pub-cache/hosted/pub.dev/auto_orientation-*/android/build.gradle')
          files = glob.glob(pattern)

          for file_path in files:
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'namespace' not in content:
                  content = content.replace('android {', 'android {\n    namespace "com.rizkyghofur.autoorientation"')
                  with open(file_path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"Patched namespace into: {file_path}")
          EOF
          )
          python3 -c "$PYTHON_SCRIPT"

      # 5. 构建 APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # 6. 上传最终 APK 产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
