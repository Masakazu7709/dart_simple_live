name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 解决所有依赖冲突与 auto_orientation 插件找不到的问题
      - name: Patch Dependencies
        run: |
          cd simple_live_app
          # 1. 解除 intl 版本限制
          sed -i 's/intl: \^0.20.2/intl: any/g' pubspec.yaml
          
          # 2. 重写锁定 dynamic_color 与 auto_orientation
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  dynamic_color: 1.7.0" >> pubspec.yaml
          echo "  auto_orientation: any" >> pubspec.yaml

      # 清理旧编译缓存并拉取依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter clean
          flutter pub get

      # 构建 Release APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # 上传 APK 产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
