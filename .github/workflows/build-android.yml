name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # 升级到 3.38.x 以提供足够的 Dart SDK 版本 (Dart >= 3.10)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 解绑 intl 依赖版本，解决 SDK 锁定死锁
      - name: Unlock intl dependency version
        run: |
          cd simple_live_app
          sed -i 's/intl: \^0.20.2/intl: any/g' pubspec.yaml

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 构建 APK 并绕过 Gradle 版本强检
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
