name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 安全修补 pubspec.yaml
      - name: Safely Patch pubspec.yaml
        run: |
          cd simple_live_app
          python3 -c "
          path = 'pubspec.yaml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # 替换 intl 约束
          content = content.replace('intl: ^0.20.2', 'intl: any')

          # 在 dependencies: 节点下插入 auto_orientation
          if 'auto_orientation:' not in content:
              content = content.replace('dependencies:\n', 'dependencies:\n  auto_orientation: ^2.2.1\n')

          # 在文件末尾追加顶级 dependency_overrides
          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  dynamic_color: 1.7.0\n'

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # 2. 清理陈旧写死的 Plugin Registrant
      - name: Clean Outdated Plugin Registrant
        run: |
          cd simple_live_app
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter clean

      # 3. 拉取依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 4. 修复 auto_orientation 插件以适配 AGP 8.0+ 规范
      - name: Fix auto_orientation Manifest and Namespace for AGP 8.0+
        run: |
          PYTHON_SCRIPT=$(cat << 'EOF'
          import glob, os, re

          # 1. 修复 build.gradle 中缺失的 namespace
          gradle_files = glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/auto_orientation-*/android/build.gradle'))
          for file_path in gradle_files:
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'namespace' not in content:
                  content = content.replace('android {', 'android {\n    namespace "de.bytepark.autoorientation"')
                  with open(file_path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"Added namespace to: {file_path}")

          # 2. 移除 AndroidManifest.xml 中的 package 属性
          manifest_files = glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/auto_orientation-*/android/src/main/AndroidManifest.xml'))
          for file_path in manifest_files:
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # 使用正则移除 package="xxx"
              new_content = re.sub(r'\s*package="[^"]*"', '', content)
              if new_content != content:
                  with open(file_path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f"Removed package attribute from: {file_path}")
          EOF
          )
          python3 -c "$PYTHON_SCRIPT"

      # 5. 构建 Release APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # 6. 上传 APK 产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
