name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # 切回 3.38.x 以满足 intl 0.20.2 依赖需求
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 使用 --extra-front-end-options / --android-skip-build-dependency-validation 绕过检验
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
