name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 修改依赖：解绑 intl、重写 dynamic_color，并补上 missing 的 auto_orientation 依赖
      - name: Patch Dependencies
        run: |
          cd simple_live_app
          # 解除 intl 版本锁
          sed -i 's/intl: \^0.20.2/intl: any/g' pubspec.yaml
          
          # 在 dependencies 中补全 auto_orientation
          echo "  auto_orientation: ^2.2.1" >> pubspec.yaml

          # 写入 dependency_overrides 解决 dynamic_color 语法问题
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  dynamic_color: 1.7.0" >> pubspec.yaml

      # 2. 清理并重载依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter clean
          flutter pub get

      # 3. 执行编译
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # 4. 上传产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
