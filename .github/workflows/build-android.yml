name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 依赖修复与覆盖
      - name: Patch Dependencies
        run: |
          cd simple_live_app
          # 解除 intl 版本限制
          sed -i 's/intl: \^0.20.2/intl: any/g' pubspec.yaml
          
          # 覆盖 dynamic_color 避开语法 Bug
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  dynamic_color: 1.7.0" >> pubspec.yaml

      # 2. 关键一步：彻底强制彻底清理写死的陈旧插件注册 Java 文件
      - name: Clean Outdated Generated Plugin Registrant
        run: |
          rm -f simple_live_app/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      # 3. 拉取依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 4. 编译 Release APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # 5. 上传产物
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
