name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install mpv dependency
        run: choco install mpv -y

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 关键步骤：注入预处理器参数，绕过 MSVC C++ 协程弃用警告
      - name: Suppress MSVC Deprecation Errors
        shell: bash
        run: |
          export CXXFLAGS="$CXXFLAGS -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          export CFLAGS="$CFLAGS -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      - name: Build Windows Executable
        shell: cmd
        run: |
          set CXXFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          set CFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          cd simple_live_app
          flutter build windows --release

      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: simple_live_app/build/windows/x64/runner/Release/
